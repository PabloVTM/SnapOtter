name: build-test-publish

# Builds the community (AGPL) image on native runners for each architecture,
# smoke tests it, then publishes a multi-arch image to GHCR. A push to main
# publishes `latest`; pushing a date tag (e.g. 2026-11-09) publishes that version.

on:
  push:
    branches: [main]
    tags: ['[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build and test ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        # The amd64 image sits on a CUDA base and needs most of the runner disk.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          df -h /

      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compute image name
        id: image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/snapotter" >> "$GITHUB_OUTPUT"
          echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: snapotter:test
          provenance: false
          # always rebuild from scratch so apt-get upgrade picks up security fixes
          pull: true
          no-cache: true

      - name: Container becomes healthy and serves the community edition
        timeout-minutes: 15
        run: |
          docker run -d --name so-test -p 1349:1349 snapotter:test
          status=starting
          for _ in $(seq 150); do
            status=$(docker inspect -f '{{.State.Health.Status}}' so-test)
            [ "$status" = "healthy" ] && break
            [ "$(docker inspect -f '{{.State.Running}}' so-test)" = "true" ] || break
            sleep 5
          done
          if [ "$status" != "healthy" ]; then
            echo "container never became healthy (status: $status)"
            exit 1
          fi
          curl -sf http://localhost:1349/api/v1/health | grep -q '"status":"healthy"'
          curl -sf -o /dev/null http://localhost:1349/
          # analytics are baked off in this fork
          curl -sf http://localhost:1349/api/v1/config/analytics | grep -q '"enabled":false'
          # the commercial package must not ship in the published image
          if docker exec so-test test -e /app/packages/enterprise; then
            echo "packages/enterprise found in the image"
            exit 1
          fi
          # the PabloSystems theme is in the web bundle
          docker exec so-test grep -rlq 'pablo@systems' /app/apps/web/dist/assets

      - name: Show container logs on failure
        if: failure()
        run: docker logs so-test 2>&1 | tail -200 || true

      - name: Remove test container
        if: always()
        run: docker rm -f so-test || true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image labels
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}

      - name: Push the tested image by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # same builder, so this reuses the layers of the image tested above
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.image.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image to GHCR
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/snapotter" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            # git tag 2026-11-09 -> image tag 2026-11-09
            type=ref,event=tag
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Create and push the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:$(jq -r '.tags[0] | split(":")[1]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
